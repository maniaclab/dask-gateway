# This is a GitHub workflow defining a set of jobs with a set of steps.
# ref: https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions
#
name: Build and publish documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "dask-gateway/**"
      - "dask-gateway-server/**"
      - ".github/workflows/build-publish-docs.yaml"
  push:
    paths:
      - "docs/**"
      - "dask-gateway/**"
      - "dask-gateway-server/**"
      - ".github/workflows/build-publish-docs.yaml"
    branches: ["main"]
    tags: ["**"]
  workflow_dispatch:

env:
  commit_msg: ${{ github.event.head_commit.message }}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-docs:
    name: Build and publish documentation
    runs-on: ubuntu-24.04

    permissions:
      contents: write # push built docs to the gh-pages branch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # ref https://github.com/dask/dask-sphinx-theme/issues/68

      - name: Install Python docs requirements
        run: |
          DASK_GATEWAY_SERVER__NO_PROXY=true pip install -r docs/requirements.txt

      - name: Build docs (make html)
        run: |
          cd docs
          make html SPHINXOPTS='--color -W --keep-going'

      - name: Push built docs to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          branch: gh-pages
          folder: docs/_build/html/

  linkcheck-docs:
    name: Test links in docs
    runs-on: ubuntu-24.04

    permissions:
      contents: read # checkout the repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          # ref https://github.com/dask/dask-sphinx-theme/issues/68
      - name: Install Python docs requirements
        run: |
          DASK_GATEWAY_SERVER__NO_PROXY=true pip install -r docs/requirements.txt

      - name: Linkcheck docs (make linkcheck)
        run: |
          cd docs
          make linkcheck SPHINXOPTS='--color -W --keep-going'
